[package]
name = "rust2bmb"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rewrites Rust source into the shape of BMB source and reports what it cannot rewrite"
publish = false

[dependencies]
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
prettyplease = "0.2"
